# Builds the library and runs the JVM unit tests on every pull request.
#
# Until this existed nothing here compiled on a PR. Two consequences, both of which had
# already happened: a change could merge without ever having been built, and the automated
# review loop — which assembles its verdict from the checks on a PR — had no check to read
# and could not reach a terminal state on this repo.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  # One run per ref. A new push supersedes an in-flight run for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 17 rather than the library's own jvmTarget of 1.8: that setting controls the
      # bytecode produced for consumers, while AGP itself needs a modern JDK to run.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the library
        run: ./gradlew :releva-sdk:assembleRelease --console=plain --stacktrace

      - name: Run the unit tests
        run: ./gradlew :releva-sdk:testDebugUnitTest --console=plain --stacktrace

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: releva-sdk/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The published artifact's version and the VERSION constant have to agree, because
      # the constant is sent as options.client.version and sdkVersion on every push. When
      # they drift, the field names a release that is not the one running, and nothing
      # about that is visible from either file alone — it can only be seen by reading both.
      # The PR template asks for both to be bumped together; this is what checks it.
      - name: VERSION must match the published version
        run: |
          published=$(grep -oP '(?<=^            version = ")[^"]+' releva-sdk/build.gradle.kts)
          constant=$(grep -oP '(?<=private const val VERSION = ")[^"]+' \
            releva-sdk/src/main/kotlin/ai/releva/sdk/client/RelevaClient.kt)
          echo "build.gradle.kts : $published"
          echo "RelevaClient.kt  : $constant"
          if [ -z "$published" ] || [ -z "$constant" ]; then
            echo "::error::could not read one of the versions — has either declaration moved?"
            exit 1
          fi
          if [ "$constant" != "${published}-kotlin" ]; then
            echo "::error::VERSION is '$constant' but the published version is '$published'."
            echo "::error::Expected '${published}-kotlin'. Bump both together."
            exit 1
          fi
          echo "consistent"
