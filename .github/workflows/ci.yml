# Builds the library and runs the JVM unit tests on every pull request.
#
# Until this existed nothing here compiled on a PR. Two consequences, both of which had
# already happened: a change could merge without ever having been built, and the automated
# review loop — which assembles its verdict from the checks on a PR — had no check to read
# and could not reach a terminal state on this repo.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  # One run per ref. A new push supersedes an in-flight PR run; master runs are
  # left alone so every commit on the release branch keeps its own verdict —
  # JitPack publishes from tags cut off master, and cancelling a master run
  # makes it look like that commit was never verified.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 17 rather than the library's own jvmTarget of 1.8: that setting controls the
      # bytecode produced for consumers, while AGP itself needs a modern JDK to run.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # No explicit Android SDK setup: ubuntu-latest ships one with API 35 and the
      # licences pre-accepted, which is what compileSdk = 35 needs. This is an
      # undocumented dependency on the runner image — if a rollout ever drops or
      # changes it, the failure here won't look like this comment.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A single :releva-sdk:build runs assemble + both unit test variants + Android
      # Lint, matching the Makefile's and cloudbuild-ci.yaml's `:releva-sdk:test` and
      # the ./gradlew test the PR template's release checklist promises. Two separate
      # invocations (assembleRelease, then testDebugUnitTest) covered less than that.
      - name: Build the library and run the checks
        run: ./gradlew :releva-sdk:build --console=plain --stacktrace

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          # Reports land per-variant now, and the JUnit XML (not just the rendered
          # HTML) is included so a reporter action could annotate failures inline.
          path: |
            releva-sdk/build/reports/tests
            releva-sdk/build/test-results
          if-no-files-found: ignore

  version:
    name: version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The published artifact's version and the VERSION constant have to agree, because
      # the constant is sent as options.client.version and sdkVersion on every push. When
      # they drift, the field names a release that is not the one running, and nothing
      # about that is visible from either file alone — it can only be seen by reading both.
      # The PR template asks for both to be bumped together; this is what checks it.
      - name: VERSION must match the published version
        run: |
          # `| head -1` is what actually keeps `bash -e` (the default for a `run:`
          # block with no shell: key) from aborting: it's the last command in the
          # pipeline and always exits 0 (pipefail isn't set), so a failed grep can no
          # longer abort the script before the -z check below runs — which is exactly
          # the scenario ("has either declaration moved?") the check exists to
          # diagnose. It also pins each substitution to its first match, so a second
          # "version = " at the same indentation (a commented-out line, a second
          # publication) can't turn $published into two lines and fail the comparison
          # with a confusing message. `|| true` is redundant given `head -1`'s exit
          # code, but kept as insurance if `head` is ever dropped.
          #
          # `\K` rather than a lookbehind: PCRE lookbehinds must be fixed length, and
          # the indentation before `version = "` isn't, so `(?<=^\s*version = ")`
          # fails to compile ("lookbehind assertion is not fixed length", exit 2) and
          # this job fails red on every run. `\K` resets the match start instead of
          # asserting backwards, so it allows the variable-length prefix.
          published=$(grep -oP '^\s*version = "\K[^"]+' releva-sdk/build.gradle.kts | head -1 || true)
          constant=$(grep -oP 'private const val VERSION = "\K[^"]+' \
            releva-sdk/src/main/kotlin/ai/releva/sdk/client/RelevaClient.kt | head -1 || true)
          echo "build.gradle.kts : $published"
          echo "RelevaClient.kt  : $constant"
          if [ -z "$published" ] || [ -z "$constant" ]; then
            echo "::error::could not read one of the versions — has either declaration moved?"
            exit 1
          fi
          if [ "$constant" != "${published}-kotlin" ]; then
            echo "::error::VERSION is '$constant' but the published version is '$published'."
            echo "::error::Expected '${published}-kotlin'. Bump both together."
            exit 1
          fi
          echo "consistent"
