name: PR Review with Progress Tracking

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push supersedes the review of the previous head, so cancel the in-flight one
# rather than paying for both.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-with-tracking:
    runs-on: ubuntu-latest
    # Review only branches pushed to this repository, never a pull request opened from a
    # fork. Pushing a branch here requires write access, so this is the check for "opened
    # by someone on the team" - and it is the reliable one: author_association reports a
    # member whose organization membership is private as CONTRIBUTOR, which would lock out
    # our own people. On a public repository it also makes a stranger's pull request skip
    # cleanly instead of failing red.
    #
    # Dependabot no longer needs its own trigger here. The separate one existed only to
    # reach secrets, which a Dependabot-triggered run cannot see. Federation needs no
    # secret - only id-token: write - and Dependabot pushes its branches to this
    # repository, so it passes the gate on the ordinary pull_request path.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Skip a repeat review of an already-reviewed commit
        id: gate
        # ready_for_review fires when a draft is published and reopened when a closed
        # pull request comes back; both can land on a head that was already reviewed.
        # The review loop opens its pull requests as drafts and publishes them only once
        # the review has converged, so without this the publish pays for a second review
        # of the commit that was just reviewed - and posts it after the loop has exited,
        # with nobody left to act on it. Skip only when a completed, successful run of
        # this workflow already exists for this exact head SHA: toggling draft state on a
        # head that no review ever attached to is the manual way to force one, and must
        # still review. status=success excludes both the in-flight current run and the
        # skipped twin that every pull request event produces from the other trigger. A
        # failed lookup falls through to reviewing - never skip a review on a guess.
        if: github.event.action == 'ready_for_review' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          runs="repos/$REPO/actions/workflows/pr-review.yml/runs?head_sha=$SHA&status=success&per_page=1"
          n=$(gh api "$runs" --jq .total_count 2>/dev/null || echo 0)
          case "$n" in '' | *[!0-9]*) n=0 ;; esac
          echo "reviewed=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Check out the PR head commit itself rather than the merge commit
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        if: steps.gate.outputs.reviewed != 'true'
        # Pinned because @v1 floats and the bundled CLI - including its default model - floats with it.
        # The CLI version is pinned here; the model is pinned explicitly via --model on the claude_args below.
        # Bumping the action version should be a deliberate commit.
        uses: anthropics/claude-code-action@v1.0.183
        with:
          # Workload identity federation: the action exchanges this run's GitHub OIDC
          # token (hence id-token: write above) for a short-lived Claude token, so no
          # Anthropic credential is stored on this repository. The two ids are not
          # themselves credentials - the federation rule only accepts a token whose claims
          # match it - so they are organization variables, and this block is identical in
          # every repository.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: dependabot
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Your job is ONLY to review code. Do NOT apply any fixes.

            Review ONLY the changes in this PR's diff. Do not review pre-existing code that
            this PR does not touch, and do not propose refactors of surrounding code. Exception:
            you may read CHANGELOG.md, releva-sdk/build.gradle.kts, and RelevaClient.kt even when
            they are outside the diff, solely to check the release checklist below - that lookup
            is not a review of unrelated code.

            CONTEXT: this repository is a published Android SDK. It is consumed by host apps
            via JitPack, and it has a sibling iOS SDK (sdk-swift) whose behaviour it is meant
            to match. Two things therefore carry more weight here than in an application:
            a change to public API or to on-the-wire payloads is a compatibility concern for
            every integrator, and a behavioural difference from sdk-swift is a defect even
            when the Kotlin side is defensible on its own.

            Every finding MUST be labelled with exactly one severity, as the first thing in
            the finding:

            BLOCKING - the change is incorrect or unsafe to merge: a logic error, a crash, a
            leaked credential, an Activity or Context leak, blocking work on the main thread,
            a lifecycle bug that loses or duplicates state across configuration change or
            process death, silently dropped work (a full buffer, a cancelled collector, a
            swallowed exception on a path that matters), a breaking change to public API or
            to a request payload without a major version bump, a missing unit test for a
            code path this PR changes, or a behaviour change shipped without the two
            version bumps (`version` in `releva-sdk/build.gradle.kts` and the `VERSION`
            constant in `RelevaClient.kt`, which must stay equal apart from the `-kotlin`
            suffix) and the CHANGELOG entry the PR template requires.

            MAJOR - the change works but has a real defect a maintainer would want fixed
            before merge: an unhandled error path that can occur on a device, an API-level or
            permission case that silently does nothing, a performance problem with a concrete
            mechanism you can name, a genuine correctness risk under retry or reconnection, or
            a divergence from sdk-swift's behaviour that an integrator would notice.

            NIT (optional, no change required) - everything else: naming, style, comment
            wording, formatting, test-name preferences, and suggestions that are matters of
            taste. This repository has no ktlint or detekt configuration, so formatting and
            idiom preferences are always NITs, never BLOCKING. Say
            "NIT (optional, no change required)" verbatim so a future filter in
            apply-fixes.yml can classify it.

            Calibration rules:
            - Do not invent BLOCKING or MAJOR findings to seem thorough. If the diff is
              correct and safe, say so plainly and report only nits, or nothing at all. A
              review with no findings is a valid and useful outcome.
            - Do not request README or documentation updates unless this PR adds a
              user-facing feature or changes public API.
            - Do not request additional test scenarios unless you can name a specific branch
              or input this PR introduces that is untested and could plausibly break. Unit
              tests here run under Robolectric via `./gradlew test`; there is no instrumented
              suite and no emulator in CI, so do not ask for a test nothing can execute.
            - Do not restate the same point at two severities, and do not repeat a finding
              you have already made inline as a top-level comment.
            - If you assert that a dependency or an Android API behaves a particular way, be
              sure it does; do not guess at a third-party API's behaviour.
            - The sdk-swift sources are NOT in this checkout. If a finding rests on what the
              iOS SDK does, say that it needs checking rather than asserting it.

            Use inline comments for findings tied to specific lines. Put the summary,
            general observations, and praise in the progress-tracking comment this run
            already owns - do NOT open a second top-level comment. Begin your part of
            that comment with a one-line verdict on its own line, choosing the first one
            that applies: "Blocking findings present." if there is any BLOCKING finding;
            otherwise "Major findings present, none blocking." if there is any MAJOR
            finding; otherwise "No blocking findings."
            That sentence must have nothing else on its line - no heading, no prefix, no
            trailing clause - even though track_progress may prepend its own header block
            above it. It is read by an automated loop with a whole-line match, and a verdict
            sharing its line is read as no verdict at all.

          # --model pins the reviewer model explicitly; the action pin above only fixes the CLI.
          # Note: claude_args is a block scalar - inline '#' comments are passed to the CLI verbatim
          # and swallow everything after them on the same string. Keep comments outside this block.
          claude_args: |
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"